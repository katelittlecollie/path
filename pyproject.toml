[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "little-collie-path"
version = "0.1.0"
description = "File-based project documentation for AI-assisted builds — a CLI that checks the mechanical half of done and refuses to judge the rest."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Little Collie" }]
keywords = [
    "agentic-coding",
    "ai-agents",
    "documentation",
    "project-management",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/katelittlecollie/path"
Source = "https://github.com/katelittlecollie/path"

[project.scripts]
path = "little_collie_path.bin.path:main"

# The installed layout mirrors the repository layout, because the modules
# resolve their canonical assets relative to themselves: scripts/ sits beside
# blueprints/ and tasks/, and bin/path reaches its siblings through
# ``Path(__file__).parent.parent``. Remapping the tree here keeps that one
# assumption true in a wheel without changing a line of code.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"scripts" = "little_collie_path/scripts"
"blueprints" = "little_collie_path/blueprints"
".agents" = "little_collie_path/.agents"
".claude/skills" = "little_collie_path/.claude/skills"
"bin/path" = "little_collie_path/bin/path.py"
"tasks/TASK-TEMPLATE.md" = "little_collie_path/tasks/TASK-TEMPLATE.md"
"tasks/BATCH-TEMPLATE.md" = "little_collie_path/tasks/BATCH-TEMPLATE.md"

[tool.hatch.build.targets.sdist]
include = [
    "/bin",
    "/scripts",
    "/blueprints",
    "/tests",
    "/tasks/TASK-TEMPLATE.md",
    "/tasks/BATCH-TEMPLATE.md",
    "/.agents",
    "/.claude/skills",
    "/AGENTS.md",
    "/README.md",
    "/LICENSE",
]
